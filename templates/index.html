<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Price Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .badge {
      display: inline-block;
      background: #e8f4ff;
      color: #1a6fbe;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    input[type="number"], select {
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      color: #1a1a2e;
      transition: border-color 0.2s;
      background: #fafafa;
    }

    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      background: #fff;
    }

    .toggle-row {
      display: flex;
      gap: 12px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .toggle-btn.active {
      border-color: #3b82f6;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .predict-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s, transform 0.1s;
    }

    .predict-btn:hover { background: #1d4ed8; }
    .predict-btn:active { transform: scale(0.98); }
    .predict-btn:disabled { background: #93c5fd; cursor: not-allowed; }

    .result {
      margin-top: 24px;
      padding: 20px;
      background: linear-gradient(135deg, #eff6ff, #f0fdf4);
      border-radius: 12px;
      border: 1px solid #bfdbfe;
      display: none;
      text-align: center;
    }

    .result.show { display: block; }
    .result .label { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
    .result .price { font-size: 32px; font-weight: 800; color: #1d4ed8; }
    .result .note  { font-size: 12px; color: #9ca3af; margin-top: 6px; }

    .error-box {
      margin-top: 16px;
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #dc2626;
      font-size: 13px;
      display: none;
    }

    .error-box.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <!-- <div class="badge">ML PROJECT · LINEAR REGRESSION</div> -->
    <h1>🏡 House Price Predictor</h1>
    <p class="subtitle">Enter property details to get an estimated market price instantly.</p>

    <div class="grid">
      <div class="field">
        <label>Area (sq ft)</label>
        <input type="number" id="area" placeholder="e.g. 1500" min="100" max="10000">
      </div>
      <div class="field">
        <label>Bedrooms</label>
        <select id="bedrooms">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="field">
        <label>Bathrooms</label>
        <select id="bathrooms">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="field">
        <label>Age (years)</label>
        <input type="number" id="age" placeholder="e.g. 5" min="0" max="100">
      </div>
      <div class="field full">
        <label>Distance from city centre (km)</label>
        <input type="number" id="distance" placeholder="e.g. 10" min="0.5" max="100" step="0.5">
      </div>
      <div class="field">
        <label>Garage</label>
        <div class="toggle-row">
          <div class="toggle-btn active" id="garage-yes" onclick="setToggle('garage', 1)">Yes</div>
          <div class="toggle-btn" id="garage-no"  onclick="setToggle('garage', 0)">No</div>
        </div>
      </div>
      <div class="field">
        <label>Garden</label>
        <div class="toggle-row">
          <div class="toggle-btn active" id="garden-yes" onclick="setToggle('garden', 1)">Yes</div>
          <div class="toggle-btn" id="garden-no"  onclick="setToggle('garden', 0)">No</div>
        </div>
      </div>
    </div>

    <button class="predict-btn" id="btn" onclick="predict()">Predict Price</button>

    <div class="result" id="result">
      <div class="label">Estimated Market Price</div>
      <div class="price" id="price-output">—</div>
      <div class="note">Based on Linear Regression model · For demo purposes</div>
    </div>

    <div class="error-box" id="error-box"></div>
  </div>

  <script>
    const toggleState = { garage: 1, garden: 1 };

    function setToggle(name, val) {
      toggleState[name] = val;
      document.getElementById(name + '-yes').classList.toggle('active', val === 1);
      document.getElementById(name + '-no').classList.toggle('active',  val === 0);
    }

    async function predict() {
      const area     = document.getElementById('area').value;
      const age      = document.getElementById('age').value;
      const distance = document.getElementById('distance').value;

      if (!area || !age || !distance) {
        showError('Please fill in all fields.');
        return;
      }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Predicting…';
      hideError();

      const payload = {
        area_sqft:   parseFloat(area),
        bedrooms:    parseInt(document.getElementById('bedrooms').value),
        bathrooms:   parseInt(document.getElementById('bathrooms').value),
        age_years:   parseInt(age),
        distance_km: parseFloat(distance),
        has_garage:  toggleState.garage,
        has_garden:  toggleState.garden,
      };

      try {
        const res  = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (data.status === 'success') {
          const formatted = '₹' + (data.price / 100000).toFixed(2) + ' Lakh';
          document.getElementById('price-output').textContent = formatted;
          document.getElementById('result').classList.add('show');
        } else {
          showError('Prediction failed: ' + data.error);
        }
      } catch (e) {
        showError('Could not connect to server. Try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Predict Price';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-box');
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideError() {
      document.getElementById('error-box').classList.remove('show');
    }
  </script>
</body>
</html>
